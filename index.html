<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title Tag (Optimisé avec un mot-clé secondaire & proposition de valeur) -->
    <title>
      Future Schools Excellence Summit | AI, Accreditation & Education
    </title>

    <!-- Meta Description (Optimisée ~150-160 caractères, percutante et incitative au clic) -->
    <meta
      name="description"
      content="Join the Future Schools Excellence Summit. Explore AI in education, school accreditation, quality standards, and digital transformation for modern leaders."
    />

    <!-- Canonical URL (Évite le duplicate content) -->
    <link rel="canonical" href="https://www.futureschoolssummit.com/" />

    <!-- Robots Tag -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Theme & Color -->
    <meta name="theme-color" content="#071A2B" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.futureschoolssummit.com/" />
    <meta
      property="og:title"
      content="Future Schools Excellence Summit | Shaping the Future of Education"
    />
    <meta
      property="og:description"
      content="A premier two-day summit on AI, accreditation, quality standards, and digital transformation in school education."
    />
    <!-- Utilisation d'un chemin absolu et d'une image dédiée aux réseaux (1200x630 px) -->
    <meta
      property="og:image"
      content="https://www.futureschoolssummit.com/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Future Schools Excellence Summit Banner"
    />
    <meta property="og:site_name" content="Future Schools Excellence Summit" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Future Schools Excellence Summit | AI & Digital Education"
    />
    <meta
      name="twitter:description"
      content="Empowering education leaders with AI, quality standards, and digital transformation."
    />
    <meta
      name="twitter:image"
      content="https://www.futureschoolssummit.com/og-image.jpg"
    />

    <!-- Favicon & Apple Icons (Format optimisé) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo2.png" />

    <!-- Fonts (Performances Web Vitals : preconnect + display=swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Données Structurées JSON-LD (Schema.org / Event) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationEvent",
        "name": "Future Schools Excellence Summit",
        "description": "A premier event focusing on AI, school quality, accreditation, and digital transformation in education.",
        "startDate": "2026-11-15T09:00:00+00:00",
        "endDate": "2026-11-16T17:00:00+00:00",
        "eventStatus": "https://schema.org/EventScheduled",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "location": {
          "@type": "Place",
          "name": "Convention Center",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "123 Education Ave",
            "addressLocality": "City",
            "addressCountry": "US"
          }
        },
        "organizer": {
          "@type": "Organization",
          "name": "Future Schools Excellence Summit",
          "url": "https://www.futureschoolssummit.com"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
